# Мост наружу для api.telegram.org и api.anthropic.com — см. worker.js.
#
# Развёртывание из этой папки:
#   npx wrangler secret put RELAY_KEY   (значение — из relay-key.txt в корне)
#   npx wrangler deploy
name = "fitpro-egress"
main = "worker.js"
compatibility_date = "2026-08-01"

# Наблюдение включено намеренно: когда мост однажды перестанет пускать, разбор
# начнётся с вопроса «а запросы вообще доходили», и ответ на него должен быть.
[observability]
enabled = true

# РАЗМЕЩЕНИЕ — «умное», и это здесь не оптимизация, а суть работы.
#
# По умолчанию воркер исполняется в точке присутствия, ближайшей к звонящему, а
# звонит к нам сервер из Москвы. То есть наружу мост выходил бы с российского
# адреса Cloudflare — ровно с таким же результатом, ради обхода которого он и
# заведён: Telegram отвечает 401, Anthropic 403.
#
# smart переносит исполнение ближе к тому, КУДА мост ходит, — то есть за
# пределы страны, и наружу запрос уходит уже оттуда.
[placement]
mode = "smart"
