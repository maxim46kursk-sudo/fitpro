# .github/workflows/fitpro-monitor.yml
# Сторож FitPro: аптайм сайта и сервера базы + здоровье беты Motion.
# Тишина = норма. Пишет в Telegram только при проблеме и КРАСИТ прогон красным.
#
# ЧЕГО ЭТОТ СТОРОЖ НЕ ВИДИТ — знать обязательно.
#
# Он смотрит из бегунков GitHub, а это США и Европа. 25 августа сайт лежал для
# России около сорока минут: с рабочего места и с телефона владельца не
# открывался ни сайт, ни база, ping не доходил вовсе. Сторож в это время дважды
# сказал «всё работает» — и был прав: из Европы сервер отвечал 200, его запросы
# видно в логах Caddy. Отсюда правило: ЭТОТ ФАЙЛ ЛОВИТ ПАДЕНИЕ СЕРВЕРА, А НЕ
# ОБРЫВ МАРШРУТА ИЗ РОССИИ. Второе — самый вероятный отказ у этого продукта
# (ради него и уезжали с Vercel), и ловится оно только пробой ИЗ России.
#
# За тем, что сторож вообще ходит, следит сервер: scripts/watchdog-heartbeat.sh
# спрашивает у GitHub, когда прогон был последним, и кричит в Telegram, если
# сторож замолчал. Расписание GitHub — обещание, а не гарантия: заявленные
# десять минут на деле выходят двадцатью и тридцатью, а под нагрузкой прогон
# выбрасывается совсем.
# Секреты репозитория (Settings → Secrets → Actions):
#   TELEGRAM_BOT_TOKEN — токен бота
#   TELEGRAM_CHAT_ID   — chat_id Максима
#   MOTION_HEALTH_URL  — https://fitproapp.ru/api/motion-health/<ключ>

name: FitPro monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # аптайм — каждые 10 минут
    - cron: "7 * * * *"      # Motion — раз в час
  workflow_dispatch:         # ручной запуск для теста (проверяет всё)
    inputs:
      test_alert:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

jobs:
  uptime:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Проверка сайта и сервера базы
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          alert() { curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                    -d chat_id="${TG_CHAT}" --data-urlencode text="$1" >/dev/null; }

          # сайт: жив, если код 2xx/3xx и в ответе есть HTML
          check_site() {
            body=$(curl -sS -m 20 -L -w '\n%{http_code}' https://fitproapp.ru 2>/dev/null) || return 1
            code=${body##*$'\n'}
            [[ $code =~ ^[23] ]] && grep -qi '<html' <<<"$body"
          }
          # сервер базы: жив при любом ответе, кроме таймаута/обрыва/5xx (401/403 — норма, шлюз Kong просит ключ)
          check_api() {
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://api.fitproapp.ru/auth/v1/health 2>/dev/null) || return 1
            [[ $code != 000 ]] && [[ ! $code =~ ^5 ]]
          }

          if [[ "${{ github.event.inputs.test_alert }}" == "true" ]]; then
            alert "✅ Тест: сторож FitPro в GitHub Actions подключён, тревоги будут приходить сюда."
            echo "Тестовое сообщение отправлено"
          fi

          fail=""
          if ! check_site; then sleep 120; check_site || fail+="site"; fi
          if ! check_api;  then sleep 120; check_api  || fail+=" api"; fi

          [[ -z $fail ]] && { echo "Проверка: всё работает"; exit 0; }

          msg="🔴 FitPro упал:"
          [[ $fail == *site* ]] && msg+=$'\n'"— сайт fitproapp.ru (свой сервер, host fitpro). Шаг 1: systemctl status fitpro-app; systemctl status caddy. Откат: вернуть A-записи fitproapp.ru и www на 216.198.79.1 в панели Timeweb — Vercel держим запасным примерно до 31.08."
          [[ $fail == *api* ]]  && msg+=$'\n'"— сервер базы api.fitproapp.ru (VPS/Supabase). Шаг 1: ssh fitpro; cd /root/supabase && docker compose ps."
          alert "$msg"
          echo "$msg"
          # ПАДАЕМ НАРОЧНО. Раньше шаг с тревогой заканчивался успехом, и в
          # списке прогонов зелёное стояло и там, где сторож кричал: понять,
          # была ли тревога, можно было только открыв логи. Красный прогон
          # виден из списка, из бейджа и из письма GitHub — это второй канал на
          # случай, если Telegram не дошёл.
          exit 1

  motion:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Проверка беты Motion
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ secrets.MOTION_HEALTH_URL }}
        run: |
          set -u
          alert() { curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                    -d chat_id="${TG_CHAT}" --data-urlencode text="$1" >/dev/null; }

          fetch() { curl -sS -m 20 "$URL" 2>/dev/null | jq -e '.["час"]' >/dev/null 2>&1 && curl -sS -m 20 "$URL"; }
          json=$(fetch) || { sleep 120; json=$(fetch) || { alert "🟠 Motion: сводка не открылась дважды — наблюдение ослепло. Проверь $URL"; exit 0; }; }

          h() { jq -r "$1 // 0" <<<"$json"; }
          errors=$(h '.["час"].error_log.["записей"]')
          reports=$(h '.["час"].motion_log.["по_типам"].["user.report"]')
          model=$(h '.["час"].motion_log.["по_типам"].["model.error"]')
          assets=$(h '.["час"].motion_log.["по_типам"].["assets.fallback"]')
          events=$(h '.["час"].motion_log.["событий"]')
          # обмен прогрессом: не прочитали с сервера / не отправили наверх.
          # Для участника сезона это не мелочь: он играет по последнему кэшу
          # устройства, и его очки могут не сойтись с общей таблицей потока.
          syncload=$(h '.["час"].motion_log.["по_типам"].["sync.load-failed"]')
          synchydr=$(h '.["час"].motion_log.["по_типам"].["sync.hydrate-failed"]')
          syncpush=$(h '.["час"].motion_log.["по_типам"].["sync.push-failed"]')
          # МАЯЧКИ НЕВЗЛЕТЕВШЕЙ ЗАГРУЗКИ. Один-два за час — это чей-то метущийся
          # вагон метро, и кричать о нём значит приучить себя не читать эти
          # сообщения. Больше трёх — уже не связь у одного человека, а мы.
          boot=$(h '.["час"].boot_beacons.["маячков"]')
          bootday=$(h '.["сутки"].boot_beacons.["маячков"]')
          bootstage=$(jq -rc '.["час"].boot_beacons.["по_стадиям"] // {}' <<<"$json")
          bootdev=$(jq -rc '.["час"].boot_beacons.["устройства"] // {}' <<<"$json")
          tries=$(h '.["сутки"].motion_attempts.["попыток"]')
          people=$(h '.["сутки"].motion_attempts.["уникальных_людей"]')

          problems=""
          (( errors  > 0 )) && problems+=$'\n'"— error_log за час: $errors"
          (( reports > 0 )) && problems+=$'\n'"— жалобы user.report за час: $reports"
          (( model   >= 5 )) && problems+=$'\n'"— model.error за час: $model"
          (( assets  >= 5 )) && problems+=$'\n'"— assets.fallback за час: $assets"
          (( syncload + synchydr > 0 )) && problems+=$'\n'"— прогресс не загрузился за час: $((syncload + synchydr)). Люди играют по кэшу устройства, у участников сезона результат может не попасть в зачёт."
          (( syncpush > 0 )) && problems+=$'\n'"— результат не уехал наверх за час: $syncpush. Не потерян (лежит на устройстве), но на сервере его пока нет."
          (( boot > 3 )) && problems+=$'\n'"— приложение не загрузилось у людей: $boot раз за час (за сутки $bootday). Встали на стадиях: $bootstage. Устройства: $bootdev. Стадия html — не приехал бандл, bundle — упал код."

          if [[ -z $problems ]]; then
            echo "Бета в порядке: событий за час $events; за сутки попыток $tries, людей $people; маячков загрузки за час $boot, за сутки $bootday"
          else
            alert "🟠 ПРОБЛЕМА в бете Motion:$problems"$'\n'"Событий за час: $events; за сутки попыток $tries, людей $people"
            echo "ПРОБЛЕМА:$problems"
            exit 1
          fi
