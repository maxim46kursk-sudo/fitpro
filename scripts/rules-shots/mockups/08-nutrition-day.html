<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Карточка дня питания</title>
<!--
  МАКЕТ БУДУЩЕГО ЭКРАНА: оценка дня по питанию.
  Экрана в приложении ещё нет, а в правилах он объясняется (docs/challenge-rules.md,
  экран 8) — поэтому картинка собрана здесь, в палитре приложения (src/theme.js) и
  теми же цветами макросов, что в дневнике: калории KCAL, белки TEA, углеводы BLU,
  жиры COR. Когда экран будут делать, эта разметка и есть его основа.
  Числа — из примера правил: коридор 10%, промах 20% = 80 баллов.
-->
<style>
  :root {
    --bg:#0b0b0d; --surf:#1c1c1e; --surf2:#2c2c2e; --hair:rgba(255,255,255,.12);
    --txt:#fff; --txt2:rgba(235,235,245,.62); --txt3:rgba(235,235,245,.30);
    --kcal:#BF5AF2; --p:#30D158; --c:#0A84FF; --f:#FF9F0A; --good:#78E6BE;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    width:720px; height:624px; background:var(--bg); color:var(--txt);
    font:400 15px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .card { width:600px; background:var(--surf); border:1px solid var(--hair); border-radius:22px; padding:26px 28px; }
  .head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
  .day { font-size:20px; font-weight:800; }
  .date { font-size:13px; color:var(--txt3); }
  .score { text-align:right; }
  .score b { display:block; font-size:44px; font-weight:900; line-height:1; color:var(--good); }
  .score span { font-size:12px; color:var(--txt2); }
  .row { margin-bottom:16px; }
  .row:last-of-type { margin-bottom:0; }
  .line { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; font-size:13px; }
  .name { font-weight:700; }
  .fact { color:var(--txt2); }
  .pts { font-weight:800; font-variant-numeric:tabular-nums; }
  .bar { position:relative; height:10px; border-radius:6px; background:var(--surf2); overflow:hidden; }
  .bar i { position:absolute; inset:0 auto 0 0; border-radius:6px; display:block; }
  /* Коридор ±10% — светлая засечка: попал в него, значит сто баллов. */
  .bar u { position:absolute; top:-3px; bottom:-3px; width:2px; background:rgba(255,255,255,.45); }
  .foot { margin-top:22px; padding-top:16px; border-top:1px solid var(--hair); font-size:12px; color:var(--txt3); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <div class="day">День 12 — питание</div>
        <div class="date">4 приёма пищи · записи есть</div>
      </div>
      <div class="score"><b>95%</b><span>оценка дня</span></div>
    </div>

    <div class="row">
      <div class="line"><span class="name">Калории</span><span class="fact">1 980 из 2 000 ккал</span><span class="pts" style="color:var(--kcal)">100</span></div>
      <div class="bar"><i style="width:99%;background:linear-gradient(90deg,#BF5AF2,#e07bff)"></i><u style="left:90%"></u><u style="left:110%"></u></div>
    </div>

    <div class="row">
      <div class="line"><span class="name">Белки</span><span class="fact">118 из 120 г</span><span class="pts" style="color:var(--p)">100</span></div>
      <div class="bar"><i style="width:98%;background:linear-gradient(90deg,#30D158,#5be389)"></i><u style="left:90%"></u></div>
    </div>

    <div class="row">
      <div class="line"><span class="name">Углеводы</span><span class="fact">210 из 220 г</span><span class="pts" style="color:var(--c)">100</span></div>
      <div class="bar"><i style="width:95%;background:linear-gradient(90deg,#0A84FF,#5aa8ff)"></i><u style="left:90%"></u></div>
    </div>

    <div class="row">
      <div class="line"><span class="name">Жиры</span><span class="fact">78 из 65 г</span><span class="pts" style="color:var(--f)">80</span></div>
      <div class="bar"><i style="width:100%;background:linear-gradient(90deg,#FF9F0A,#ffbf5a)"></i><u style="left:90%"></u></div>
    </div>

    <div class="foot">Промах до 10% от нормы — сто баллов. Дальше каждый процент снимает два.</div>
  </div>
</body>
</html>
